name: Steddi
options:
  bundleIdPrefix: to.nathancurtis
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.3"

targets:
  Steddi:
    type: application
    platform: iOS
    sources:
      - Steddi
    info:
      path: Steddi/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Steddi
        NSLocationWhenInUseUsageDescription: "Steddi needs your location to navigate and record routes."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Steddi needs background location access to continue navigation when the app is in the background."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - steddi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIBackgroundModes:
          - audio
          - location
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: "CarPlay"
                UISceneClassName: "CPTemplateApplicationScene"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
            CPTemplateApplicationDashboardSceneSessionRoleApplication:
              - UISceneConfigurationName: "CarPlay Dashboard"
                UISceneClassName: "CPTemplateApplicationDashboardScene"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlayDashboardDelegate"
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default"
                UISceneClassName: "UIWindowScene"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: to.nathancurtis.steddi
      DEVELOPMENT_TEAM: Z46423B3U9
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: Steddi/Info.plist
      CODE_SIGN_ENTITLEMENTS: Steddi/Steddi.entitlements
    dependencies:
      - framework: CarPlay.framework
        embed: false
      - target: SteddiLiveActivity
      - target: SteddiWidget

  SteddiWidget:
    type: app-extension
    platform: iOS
    sources:
      - SteddiWidget
    info:
      path: SteddiWidget/Info.plist
      properties:
        CFBundleDisplayName: Steddi Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: to.nathancurtis.steddi.widget
      DEVELOPMENT_TEAM: Z46423B3U9
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: SteddiWidget/Info.plist
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_ENTITLEMENTS: SteddiWidget/SteddiWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SteddiLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - SteddiLiveActivity
    info:
      path: SteddiLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Steddi Navigation
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: to.nathancurtis.steddi.live-activity
      DEVELOPMENT_TEAM: Z46423B3U9
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_FILE: SteddiLiveActivity/Info.plist
      SUPPORTS_MACCATALYST: NO
      CODE_SIGN_ENTITLEMENTS: SteddiLiveActivity/SteddiLiveActivity.entitlements
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  SteddiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SteddiTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: Z46423B3U9
      CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Steddi
