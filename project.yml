name: Steddi
options:
  bundleIdPrefix: to.nathancurtis
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.3"

packages:
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    from: "3.0.0"

targets:
  Steddi:
    type: application
    platform: iOS
    sources:
      - Steddi
    info:
      path: Steddi/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Steddi
        MBXAccessToken: "pk.eyJ1IjoibmF0aGFuY3VydGlzIiwiYSI6ImNtbXF2YXRhbzEycGgycG9tNTAwaTRmY2YifQ.ch8h2pYyvMaAuoKgEIgDlw"
        NSLocationWhenInUseUsageDescription: "Steddi needs your location to navigate and record routes."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Steddi needs background location access to continue navigation when the app is in the background."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - steddi
        UIBackgroundModes:
          - audio
          - location
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: "CarPlay"
                UISceneClassName: "CPTemplateApplicationScene"
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: "Default"
                UISceneClassName: "UIWindowScene"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: to.nathancurtis.steddi
      DEVELOPMENT_TEAM: ""
      INFOPLIST_FILE: Steddi/Info.plist
      CODE_SIGN_ENTITLEMENTS: Steddi/Steddi.entitlements
      CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_ALLOWED: YES
      OTHER_CODE_SIGN_FLAGS: "--entitlements $(SRCROOT)/Steddi/Steddi.entitlements"
    postBuildScripts:
      - name: "Re-sign with CarPlay entitlement"
        script: |
          codesign --force --sign "-" --entitlements "${SRCROOT}/Steddi/Steddi.entitlements" "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxNavigationUIKit
      - framework: CarPlay.framework
        embed: false

  SteddiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SteddiTests
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Steddi
