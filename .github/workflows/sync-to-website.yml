name: Sync activity to website

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Generate activity JSON
        run: |
          mkdir -p output

          # Recent commits (last 50, message + date only — no code, no files)
          # Filter out any mentions of internal tools
          git log --pretty=format:'{"date":"%ad","message":"%s"}' --date=short -50 | \
            python3 -c "
          import sys, json
          lines = [json.loads(l) for l in sys.stdin if l.strip()]
          filtered = [c for c in lines if 'claude' not in c['message'].lower() and '.claude' not in c['message'].lower()]
          print(json.dumps(filtered, indent=2))
          " > output/commits.json

          # Copy TODO.md, filter internal tool mentions
          grep -vi 'claude' TODO.md > output/TODO.md 2>/dev/null || echo "# No TODO" > output/TODO.md

          # Copy constitution
          cp docs/IMPLEMENTATION_PLAN.md output/CONSTITUTION.md 2>/dev/null || echo "# No constitution" > output/CONSTITUTION.md

      - name: Checkout website repo
        uses: actions/checkout@v4
        with:
          repository: nathannncurtis/steddi-website
          token: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
          path: website
          ref: master

      - name: Copy activity into website public/data
        run: |
          mkdir -p website/public/data
          # Copy generated files flat into public/data (not into a nested dir)
          cp output/commits.json   website/public/data/commits.json
          cp output/TODO.md        website/public/data/TODO.md
          cp output/CONSTITUTION.md website/public/data/CONSTITUTION.md
          # Remove the stale nested output/ dir from a previous broken sync, if present
          rm -rf website/public/data/output

      - name: Commit and push to website repo
        run: |
          cd website
          git config user.name  'Nathan Curtis'
          git config user.email 'nathancurtis951@gmail.com'
          git add public/data/commits.json public/data/TODO.md public/data/CONSTITUTION.md
          git rm -r --cached --ignore-unmatch public/data/output >/dev/null 2>&1 || true
          if git diff --cached --quiet; then
            echo "No activity changes to sync."
            exit 0
          fi
          git commit -m 'sync: update activity from steddi repo'
          git push origin master
